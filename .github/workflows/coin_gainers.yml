name: Coin Gainers Hourly
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests openpyxl
      - run: python fetch_gainers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coin_gainers.xlsx
          git diff --staged --quiet || git commit -m "코인 상승률 TOP10 기록 - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
